# Configuracao do Prometheus para o ambiente local (Docker Compose).
#
# Os alvos sao estaticos porque a topologia do Compose e conhecida e fixa.
# No Kubernetes a descoberta e outra: o kube-prometheus-stack usa
# ServiceMonitor/PodMonitor a partir de labels; ver kubernetes/README.md.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: loja-veloz-local
    environment: development

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Os quatro servicos expoem /metrics na mesma porta da API. Manter um job
  # por servico deixa o label `job` util para filtragem, mesmo que os
  # servicos ja apliquem o label `service` por conta propria.
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:3001"]
        labels:
          service: order-service

  - job_name: inventory-service
    metrics_path: /metrics
    static_configs:
      - targets: ["inventory-service:3002"]
        labels:
          service: inventory-service

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:3003"]
        labels:
          service: payment-service

  # Metricas internas do proprio collector: util para detectar perda de spans.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
