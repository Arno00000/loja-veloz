# Loki em modo monolitico, adequado ao ambiente local.
#
# Producao usaria o modo distribuido com armazenamento em objeto (S3) e
# retencao maior; ver kubernetes/helm-values/loki.values.yaml.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Logs de conteineres podem chegar com relogio ligeiramente adiantado;
  # uma folga curta evita descarte por "too far in future".
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  # Volume esperado no ambiente local e baixo; limites folgados evitam
  # perda de log durante uma rajada de teste de carga.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

table_manager:
  retention_deletes_enabled: true
  # Sete dias e suficiente para o ciclo de desenvolvimento e demonstracao.
  retention_period: 168h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
