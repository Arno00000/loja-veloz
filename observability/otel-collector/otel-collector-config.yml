# OpenTelemetry Collector.
#
# Papel no desenho: ponto unico de entrada de telemetria. As aplicacoes nao
# conhecem o Jaeger, so o collector. Trocar o backend de tracing (Jaeger por
# Tempo, por exemplo) e mudanca de configuracao aqui, sem tocar em codigo nem
# reiniciar aplicacao com nova variavel de ambiente.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter deve ser o PRIMEIRO da cadeia: ele descarta dados quando a
  # memoria aperta, evitando que o collector seja morto por OOM e leve junto
  # tudo o que ja estava em buffer.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  # Jaeger recebe OTLP nativamente desde a versao 1.35; nao ha necessidade do
  # exportador legado de Jaeger, que foi descontinuado.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
    metrics:
      # Metricas internas do collector, coletadas pelo Prometheus.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger]

    # As metricas da aplicacao sao coletadas pelo Prometheus direto do
    # endpoint /metrics de cada servico. Este pipeline existe para o caso de
    # algum componente enviar metricas por OTLP; hoje so registra no log.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
