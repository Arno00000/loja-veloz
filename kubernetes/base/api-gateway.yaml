apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: loja-veloz
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: pedidos-veloz
spec:
  # Duas réplicas é o mínimo para que o Rolling Update não derrube o serviço.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Sobe um pod novo antes de derrubar um antigo e nunca deixa a
      # capacidade cair abaixo do total declarado. Deploy sem indisponibilidade.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: pedidos-veloz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      # 30s dá folga para o graceful shutdown configurado em 20s na aplicação.
      # Se o processo não terminar nesse prazo, o kubelet envia SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Espalha as réplicas entre nós. Sem isso, as duas podem cair no mesmo
      # nó e a perda desse nó derruba o serviço inteiro.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      containers:
        - name: api-gateway
          image: ghcr.io/USUARIO_GITHUB/loja-veloz-api-gateway:sha-PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: api-gateway
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: app-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # O Gateway é I/O-bound: encaminha requisições e não processa
            # nada pesado. CPU baixa, memória modesta.
            # O `requests` de CPU é o que o HPA usa como base de cálculo.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Sem limite de CPU de propósito: throttling de CPU em serviço
              # sensível a latência piora o p99 sem proteger o nó, que já é
              # defendido pelo `requests` do escalonador.
              memory: 256Mi
          # Startup: dá até 60s (12 x 5s) para o processo subir. Enquanto ela
          # não passa, liveness e readiness ficam suspensas — é isso que evita
          # reinício em cascata durante uma partida lenta.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          # Liveness NÃO consulta dependências: só verifica se o processo
          # responde. Verificar banco aqui mataria todos os pods de uma vez
          # em qualquer instabilidade do banco.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          # Readiness consulta dependências e devolve 503 quando o serviço
          # não pode atender. O pod sai dos endpoints sem ser reiniciado.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                # A remoção do pod dos endpoints do Service e o envio do
                # SIGTERM acontecem em paralelo. Sem esta pausa, o proxy ainda
                # pode encaminhar requisições para um pod que já começou a
                # encerrar, o que aparece como 502 esporádico durante o deploy.
                command: ["sleep", "5"]
          volumeMounts:
            # readOnlyRootFilesystem exige volumes graváveis explícitos.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: loja-veloz
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
