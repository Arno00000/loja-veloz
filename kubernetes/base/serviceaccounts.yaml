# Uma ServiceAccount por servico, em vez da `default` do namespace.
#
# Duas razoes:
#   1. identidade distinta por carga de trabalho, o que permite politica de
#      acesso granular no futuro (IRSA na AWS, por exemplo);
#   2. `automountServiceAccountToken: false` remove o token da API do
#      Kubernetes de dentro do pod. Nenhum destes servicos fala com a API do
#      cluster, entao montar a credencial so aumentaria o estrago de um
#      eventual comprometimento.
#
# Nenhum Role ou RoleBinding e criado: sem permissao alguma na API e
# exatamente o privilegio minimo necessario aqui.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: loja-veloz
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: loja-veloz
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-service
  namespace: loja-veloz
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: loja-veloz
automountServiceAccountToken: false
