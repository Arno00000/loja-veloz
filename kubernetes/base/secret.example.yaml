# =============================================================================
# MODELO. Este arquivo contém apenas PLACEHOLDERS e é versionado de propósito.
# O arquivo real (secret.yaml) está no .gitignore e NUNCA deve ser commitado.
#
# ATENÇÃO — Base64 NÃO É CRIPTOGRAFIA.
# O campo `data` de um Secret é apenas Base64, que é codificação reversível
# por qualquer pessoa com um comando de uma linha. Um Secret do Kubernetes,
# por padrão, fica armazenado em texto claro no etcd. As proteções reais são:
#   - RBAC restringindo quem lê Secrets no namespace;
#   - criptografia em repouso do etcd (EncryptionConfiguration);
#   - não versionar o arquivo real.
# Ver docs/threat-model.md.
#
# COMO CRIAR O SECRET REAL (preferível ao arquivo YAML, pois os valores não
# tocam o disco em texto claro nem entram no histórico do shell de outro
# usuário):
#
#   kubectl create secret generic app-secrets \
#     --namespace loja-veloz \
#     --from-literal=ORDERS_DATABASE_URL='postgresql://...' \
#     --from-literal=INVENTORY_DATABASE_URL='postgresql://...' \
#     --from-literal=PAYMENTS_DATABASE_URL='postgresql://...' \
#     --from-literal=RABBITMQ_URL='amqp://...' \
#     --from-literal=INVENTORY_ADMIN_KEY='...'
#
# EVOLUÇÃO RECOMENDADA (ver docs/limitations-and-roadmap.md):
#   - External Secrets Operator lendo do AWS Secrets Manager
#   - Sealed Secrets, para versionar com segurança em GitOps
#   - SOPS com KMS, para criptografia no próprio repositório
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: loja-veloz
type: Opaque
# `stringData` aceita texto puro e o Kubernetes converte. Usar aqui, em vez de
# `data`, deixa explícito que não há nenhuma proteção envolvida.
stringData:
  ORDERS_DATABASE_URL: "postgresql://SUBSTITUIR_USUARIO:SUBSTITUIR_SENHA@SUBSTITUIR_HOST:5432/orders_db?schema=public&connection_limit=10"
  INVENTORY_DATABASE_URL: "postgresql://SUBSTITUIR_USUARIO:SUBSTITUIR_SENHA@SUBSTITUIR_HOST:5432/inventory_db?schema=public&connection_limit=10"
  PAYMENTS_DATABASE_URL: "postgresql://SUBSTITUIR_USUARIO:SUBSTITUIR_SENHA@SUBSTITUIR_HOST:5432/payments_db?schema=public&connection_limit=10"
  RABBITMQ_URL: "amqp://SUBSTITUIR_USUARIO:SUBSTITUIR_SENHA@SUBSTITUIR_HOST:5672"
  INVENTORY_ADMIN_KEY: "SUBSTITUIR_CHAVE_ADMIN"
