# =============================================================================
# PostgreSQL e RabbitMQ DENTRO do cluster.
#
# ############  NÃO USE ISTO EM PRODUÇÃO  ############
#
# Existe apenas para que o overlay de desenvolvimento suba sozinho em um
# cluster local (kind, minikube, Docker Desktop), sem depender de nada externo.
#
# Por que é inadequado para produção:
#   - `emptyDir`: TODOS os dados somem quando o pod reinicia. Não há volume
#     persistente, não há backup, não há recuperação;
#   - réplica única: qualquer manutenção de nó derruba o banco;
#   - Deployment, e não StatefulSet: sem identidade estável de rede nem ordem
#     de inicialização — errado para carga com estado;
#   - senhas em texto claro neste arquivo, versionado no Git;
#   - sem ajuste de parâmetros, sem monitoramento de replicação, sem WAL
#     archiving.
#
# O correto em produção:
#   - PostgreSQL: Amazon RDS Multi-AZ (ver terraform/modules/database) ou um
#     operador maduro como CloudNativePG;
#   - RabbitMQ: Amazon MQ ou o RabbitMQ Cluster Operator oficial, com volume
#     persistente e quorum queues;
#   - credenciais no AWS Secrets Manager via External Secrets Operator.
#
# Os manifests de produção referenciam essas dependências apenas por URL no
# Secret, então migrar não exige mudar nada na aplicação.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: loja-veloz
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    create_db() {
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
        CREATE USER $2 WITH PASSWORD '$3';
        CREATE DATABASE $1 OWNER $2;
    EOSQL
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$1" <<-EOSQL
        ALTER SCHEMA public OWNER TO $2;
    EOSQL
    }
    create_db orders_db    orders_user    orders_dev_only
    create_db inventory_db inventory_user inventory_dev_only
    create_db payments_db  payments_user  payments_dev_only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: loja-veloz
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: datastore
spec:
  replicas: 1
  strategy:
    # Recreate, e não RollingUpdate: dois pods do mesmo banco escrevendo no
    # mesmo lugar corromperiam os dados.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: datastore
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-bookworm
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres_dev_only
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem: false — o entrypoint do PostgreSQL
            # escreve em vários caminhos fora do PGDATA. Desligar o controle
            # aqui é uma exceção consciente, restrita ao ambiente acadêmico.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          # DADOS EFÊMEROS. Reinício do pod = banco vazio.
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: loja-veloz
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: loja-veloz
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: datastore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: datastore
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: lojaveloz
            - name: RABBITMQ_DEFAULT_PASS
              value: lojaveloz_dev_only
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          # Filas duráveis em disco efêmero: mensagens não confirmadas somem
          # se o pod reiniciar. Aceitável em desenvolvimento, inaceitável em
          # produção.
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: loja-veloz
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
